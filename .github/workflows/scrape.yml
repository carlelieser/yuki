name: Scrape

on:
  schedule:
    - cron: '20 3 * * *'
    - cron: '40 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [refresh, discover]
        default: refresh

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - run: bun install --frozen-lockfile

      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 4 * * 0" ]; then
            echo "value=discover" >> "$GITHUB_OUTPUT"
          else
            echo "value=refresh" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh known listings
        if: steps.mode.outputs.value == 'refresh'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
        run: bun run scrape

      - name: Discover repositories added since the last run
        if: steps.mode.outputs.value == 'discover'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
        run: bun run scrape --discover

  categorize:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      CATEGORY_MODEL: qwen3.5:9b

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - run: bun install --frozen-lockfile

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama

      - name: Restore the model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.CATEGORY_MODEL }}

      - name: Start Ollama and pull the model
        run: |
          OLLAMA_MODELS="$HOME/.ollama/models" ollama serve > /tmp/ollama.log 2>&1 &
          until curl -sf http://localhost:11434/api/version > /dev/null; do sleep 1; done
          OLLAMA_MODELS="$HOME/.ollama/models" ollama pull "$CATEGORY_MODEL"

      - name: Categorize changed listings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: bun run categorize --budget-minutes=300
