name: Scrape

on:
  schedule:
    - cron: '20 3 * * *'
    - cron: '40 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [refresh, discover]
        default: refresh

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - run: bun install --frozen-lockfile

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install the APK icon extractor
        run: go install github.com/chenhuifeng/androidbinary/v2/apk/cmd/extract-icons@v2.0.10

      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 4 * * 0" ]; then
            echo "value=discover" >> "$GITHUB_OUTPUT"
          else
            echo "value=refresh" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh known listings
        if: steps.mode.outputs.value == 'refresh'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
        run: bun run scrape

      - name: Discover repositories added since the last run
        if: steps.mode.outputs.value == 'discover'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
        run: bun run scrape --discover
