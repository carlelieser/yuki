name: Release

on:
  push:
    tags: ['android-v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          echo "name=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Assemble release
        working-directory: apps/android
        env:
          YUKI_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          YUKI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YUKI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YUKI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PyukiVersionName="$VERSION_NAME" \
            -PyukiVersionCode="$VERSION_CODE" \
            -PyukiReleaseTag="$RELEASE_TAG"

      - name: Verify the APK is signed with the expected key
        id: apk
        env:
          EXPECTED: ${{ secrets.RELEASE_CERT_SHA256 }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"

          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify \
            --print-certs "$apk" > certs.txt

          actual=$(grep -i 'SHA-256 digest' certs.txt | head -1 |
            tr -d ' :' | tr 'A-F' 'a-f')
          expected=$(echo "$EXPECTED" | tr -d ' :' | tr 'A-F' 'a-f')

          test -n "$actual"
          test -n "$expected"
          echo "$actual" | grep -q "$expected"

          mv "$apk" "yuki-$VERSION_NAME.apk"
          echo "path=yuki-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Yuki ${{ steps.version.outputs.name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
