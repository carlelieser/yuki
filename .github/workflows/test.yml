name: Test

on:
  push:
    branches: [main]
    paths:
      - 'apps/scraper/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'eslint.config.ts'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'apps/scraper/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'eslint.config.ts'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: >-
          bun run --filter '@yuki/scraper' --filter '@yuki/db'
          --filter '@yuki/github' --filter '@yuki/auth' --filter '@yuki/ui' check

      - name: Unit tests
        run: >-
          bun run --filter '@yuki/scraper' --filter '@yuki/github'
          --filter '@yuki/auth' test
