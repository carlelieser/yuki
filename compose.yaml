services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yuki
      POSTGRES_PASSWORD: yuki
      POSTGRES_DB: yuki
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yuki -d yuki']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '58025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    profiles: ['scrape']
    image: oven/bun:1.4-alpine
    working_dir: /app
    command: ['bun', 'run', 'packages/scraper/src/main.ts']
    environment:
      DATABASE_URL: postgres://yuki:yuki@postgres:5432/yuki
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
